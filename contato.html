<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contato - ReWear</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', sans-serif;
}

body {
    background-color: #f5f7f6;
    color: #333;
}

/* HEADER */
header {
    background: linear-gradient(135deg, #2e7d32, #66bb6a);
    color: white;
    padding: 20px 40px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    display: flex;
    align-items: center;
    font-size: 1.8em;
    font-weight: bold;
}

.logo-circle {
    width: 40px;
    height: 40px;
    border: 3px solid white;
    border-radius: 50%;
    margin-right: 10px;
    position: relative;
}

.logo-circle::after {
    content: "♻";
    position: absolute;
    top: 5px;
    left: 7px;
    font-size: 20px;
}

nav a {
    color: white;
    margin-left: 20px;
    text-decoration: none;
    font-weight: 500;
}

nav a:hover {
    text-decoration: underline;
}

/* HERO */
.hero {
    background: url('https://images.unsplash.com/photo-1521737604893-d14cc237f11d') no-repeat center/cover;
    height: 40vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    color: white;
}

.hero-content {
    background: rgba(0,0,0,0.6);
    padding: 30px;
    border-radius: 10px;
}

.hero h1 {
    font-size: 2.8em;
}

/* CONTAINER */
.container {
    padding: 60px 40px;
    max-width: 1100px;
    margin: auto;
}

.section-title {
    text-align: center;
    margin-bottom: 20px;
    color: #2e7d32;
}

/* INFO CARDS */
.cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 25px;
    margin-bottom: 50px;
}

.card {
    background: white;
    padding: 25px;
    border-radius: 10px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    text-align: center;
    transition: 0.3s;
}

.card:hover {
    transform: translateY(-5px);
}

.card h3 {
    color: #2e7d32;
    margin-bottom: 10px;
}

/* FORM */
form {
    background: white;
    padding: 30px;
    border-radius: 10px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    max-width: 600px;
    margin: auto;
}

input, textarea {
    width: 100%;
    padding: 12px;
    margin: 10px 0;
    border: 1px solid #ccc;
    border-radius: 6px;
    outline: none;
}

input:focus, textarea:focus {
    border-color: #2e7d32;
}

textarea {
    min-height: 120px;
    resize: none;
}

/* BUTTON */
.btn {
    display: inline-block;
    width: 100%;
    padding: 12px;
    background: #66bb6a;
    color: white;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-size: 1em;
    transition: 0.3s;
}

.btn:hover {
    background: #2e7d32;
}

/* FOOTER */
footer {
    background: #1b5e20;
    color: white;
    text-align: center;
    padding: 20px;
}

/* RESPONSIVO */
@media(max-width: 768px) {
    header {
        flex-direction: column;
    }

    nav {
        margin-top: 10px;
    }

    .hero h1 {
        font-size: 2em;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">
        <div class="logo-circle"></div>
        ReWear
    </div>

    <nav>
        <a href="index.html">Início</a>
        <a href="sobre.html">Sobre</a>
        <a href="como-funciona.html">Como Funciona</a>
        <a href="impacto.html">Impacto</a>
        <a href="contato.html">Contato</a>
    </nav>
</header>

<!-- HERO -->
<section class="hero">
    <div class="hero-content">
        <h1>Fale Conosco</h1>
        <p>Tire dúvidas ou entre em contato com a equipe ReWear 📩</p>
    </div>
</section>

<!-- INFO -->
<section class="container">

    <h2 class="section-title">Canais de contato</h2>

    <div class="cards">

        <div class="card">
            <h3>📧 Email</h3>
            <p>contato@rewear.com</p>
        </div>

        <div class="card">
            <h3>📱 Instagram</h3>
            <p>@rewear</p>
        </div>

        <div class="card">
            <h3>⏰ Atendimento</h3>
            <p>Seg a Sex - 09h às 18h</p>
        </div>

    </div>

</section>

<!-- FORM -->
<section class="container">

    <h2 class="section-title">Envie uma mensagem</h2>

    <form>
        <input type="text" placeholder="Seu nome" required>
        <input type="email" placeholder="Seu email" required>
        <textarea placeholder="Escreva sua mensagem..." required></textarea>
        <button class="btn" type="submit">Enviar mensagem</button>
    </form>

</section>

<footer>
    <p>© 2026 ReWear - Moda Sustentável</p>
</footer>

</body>
</html>
